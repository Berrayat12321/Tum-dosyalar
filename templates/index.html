<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Proje Calistirma Portali</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
        .terminal { background: #000; font-family: monospace; color: #00ff00; padding: 15px; border-radius: 5px; min-height: 150px; white-space: pre-wrap; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>C++ Geliştirme Portalı</h2>
        <div class="card">
            <span>🔹 ATM Aracı Projesi</span>
            <button onclick="runProject('atm')">Projeyi Çalıştır</button>
        </div>
        <div class="card">
            <span>🔹 Hesap Makinesi Projesi</span>
            <button onclick="runProject('hesap')">Projeyi Çalıştır</button>
        </div>
        <div class="card">
            <span>🔹 Sayı Tahmin Oyunu</span>
            <button onclick="runProject('tahmin')">Projeyi Çalıştır</button>
        </div>
        <h3>🖥️ Terminal Çıktısı</h3>
        <div class="terminal" id="output">Butona bastığınızda C++ kodunun çıktısı burada simüle edilecektir...</div>
    </div>

    <script>
        function runProject(name) {
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = "Kod derleniyor... Lütfen bekleyin...";
            fetch('/run/' + name)
                .then(res => res.json())
                .then(data => outputDiv.innerText = data.output)
                .catch(err => outputDiv.innerText = "Hata olustu: " + err);
        }
    </script>
</body>
</html>
