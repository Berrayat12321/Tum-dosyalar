services:
  code-server:
    image: codercom/code-server:latest
    container_name: cpp_portal_yeni_sistem
    ports:
      - "7763:8080"
    environment:
      - PASSWORD=fstkcshp
    volumes:
      - .:/home/coder/project
    user: "root"
    entrypoint: >
      sh -c "apt-get update && apt-get install -y build-essential && exec /usr/bin/entrypoint.sh --auth password /home/coder/project"
    restart: always
