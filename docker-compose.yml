services:
  code-server:
    image: codercom/code-server:latest
    container_name: cplusplus_web_ide
    ports:
      - "7763:8080"
    environment:
      - PASSWORD=fstkcshp
    volumes:
      - .:/home/coder/project
    user: "root"
    command: >
      sh -c "apt-get update && apt-get install -y build-essential && exec /usr/bin/entrypoint.sh --auth password /home/coder/project"
    restart: always
